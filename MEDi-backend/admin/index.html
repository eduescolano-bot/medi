<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MEDi — Panel de administración</title>
<style>
  :root {
    color-scheme: light;
    --page: #f9f9f7;
    --surface: #fcfcfb;
    --surface-2: #ffffff;
    --text-primary: #0b0b0b;
    --text-secondary: #52514e;
    --muted: #898781;
    --gridline: #e1e0d9;
    --baseline: #c3c2b7;
    --border: rgba(11,11,11,0.10);
    --brand: #0B8275;
    --brand-dark: #0B3A5C;
    --brand-contrast: #ffffff;
    --chart-blue: #2a78d6;
    --chart-orange: #eb6834;
    --good: #0ca30c;
    --critical: #d03b3b;
    --critical-bg: #fbeaea;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --page: #0d0d0d;
      --surface: #1a1a19;
      --surface-2: #232322;
      --text-primary: #ffffff;
      --text-secondary: #c3c2b7;
      --muted: #898781;
      --gridline: #2c2c2a;
      --baseline: #383835;
      --border: rgba(255,255,255,0.10);
      --chart-blue: #3987e5;
      --chart-orange: #d95926;
      --good: #0ca30c;
      --critical: #e66767;
      --critical-bg: #3a2323;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--page);
    color: var(--text-primary);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    min-height: 100vh;
  }
  h1, h2, h3 { font-weight: 700; margin: 0 0 4px; }
  p { margin: 0; }
  button { font-family: inherit; cursor: pointer; }
  input, select, textarea { font-family: inherit; }
  [hidden] { display: none !important; }

  /* ---------- Login ---------- */
  #login-view {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .login-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 36px 32px;
    width: 100%;
    max-width: 360px;
    text-align: center;
  }
  .login-card .logo-dot {
    width: 52px; height: 52px; border-radius: 50%;
    background: var(--brand-dark);
    color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; font-weight: 700;
    margin: 0 auto 16px;
  }
  .login-card h1 { font-size: 18px; }
  .login-card .sub { color: var(--text-secondary); font-size: 13px; margin-top: 4px; margin-bottom: 20px; }
  .field { text-align: left; margin-bottom: 14px; }
  .field label { display: block; font-size: 12px; color: var(--text-secondary); margin-bottom: 5px; }
  .field input, .field select, .field textarea {
    width: 100%;
    padding: 9px 11px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--text-primary);
    font-size: 14px;
  }
  .field textarea { resize: vertical; min-height: 60px; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center;
    gap: 6px;
    border: none; border-radius: 9px;
    padding: 10px 16px;
    font-size: 14px; font-weight: 600;
    background: var(--brand); color: var(--brand-contrast);
  }
  .btn:disabled { opacity: 0.55; cursor: default; }
  .btn.block { width: 100%; }
  .btn.secondary { background: transparent; color: var(--text-primary); border: 1px solid var(--border); }
  .btn.danger { background: var(--critical); color: #fff; }
  .btn.small { padding: 6px 11px; font-size: 12.5px; border-radius: 7px; }
  .error-msg { color: var(--critical); font-size: 13px; margin-top: 10px; min-height: 16px; }

  /* ---------- App shell ---------- */
  #app-view { min-height: 100vh; display: flex; flex-direction: column; }
  header.topbar {
    background: var(--brand-dark);
    color: #fff;
    padding: 14px 24px;
    display: flex; align-items: center; justify-content: space-between;
  }
  header.topbar .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 15px; }
  header.topbar .brand .dot { width: 26px; height: 26px; border-radius: 50%; background: var(--brand); display:flex; align-items:center; justify-content:center; font-size: 12px; }
  nav.tabs { display: flex; gap: 4px; padding: 0 24px; background: var(--surface); border-bottom: 1px solid var(--border); }
  nav.tabs button {
    background: transparent; border: none; padding: 13px 16px;
    font-size: 13.5px; font-weight: 600; color: var(--text-secondary);
    border-bottom: 2px solid transparent;
  }
  nav.tabs button.active { color: var(--brand-dark); border-bottom-color: var(--brand); }
  main { flex: 1; padding: 22px 24px 60px; max-width: 1080px; width: 100%; margin: 0 auto; }
  .logout-link { background: transparent; border: none; color: #fff; opacity: 0.85; font-size: 12.5px; text-decoration: underline; }

  .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
  .search-input { flex: 1; min-width: 180px; max-width: 320px; }
  .search-input input { width: 100%; padding: 9px 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface-2); color: var(--text-primary); font-size: 13.5px; }

  table.list { width: 100%; border-collapse: collapse; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
  table.list th, table.list td { padding: 10px 12px; text-align: left; font-size: 13.5px; border-bottom: 1px solid var(--gridline); }
  table.list th { color: var(--muted); font-weight: 600; font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.03em; }
  table.list tr:last-child td { border-bottom: none; }
  table.list tr:hover td { background: rgba(11,130,117,0.05); }
  .chip { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 11.5px; font-weight: 600; margin: 1px 3px 1px 0; }
  .chip.especialidad { background: rgba(11,58,92,0.09); color: var(--brand-dark); }
  .chip.domicilio { background: rgba(11,130,117,0.13); color: var(--brand); }
  .chip.inactivo { background: var(--critical-bg); color: var(--critical); }
  .muted-text { color: var(--muted); font-size: 12.5px; }
  .empty-state { text-align: center; padding: 40px 20px; color: var(--text-secondary); }

  /* ---------- Modal ---------- */
  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,0.45);
    display: flex; align-items: flex-start; justify-content: center;
    padding: 30px 16px; overflow-y: auto; z-index: 50;
  }
  .modal-card {
    background: var(--surface); border-radius: 14px;
    width: 100%; max-width: 640px; padding: 26px 26px 24px;
    margin-bottom: 30px;
  }
  .modal-card h2 { font-size: 17px; margin-bottom: 18px; }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; }
  .section-title { font-size: 12.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em; color: var(--muted); margin: 22px 0 10px; }
  .check-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .check-row input { width: auto; }
  .especialidades-box { border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; max-height: 160px; overflow-y: auto; background: var(--surface-2); }
  .especialidades-box .check-row { font-size: 13.5px; margin-bottom: 4px; }
  .toggle-row { display: flex; align-items: center; gap: 8px; padding: 8px 0; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 22px; }
  .card-block { border: 1px solid var(--border); border-radius: 10px; padding: 14px; margin-bottom: 12px; background: var(--surface-2); }
  .card-block-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .horario-row { display: flex; gap: 8px; align-items: center; margin-bottom: 6px; font-size: 13px; }
  .horario-row select, .horario-row input { padding: 6px 8px; font-size: 13px; border-radius: 6px; border: 1px solid var(--border); background: var(--surface); color: var(--text-primary); }
  .maps-link { font-size: 12px; color: var(--brand); text-decoration: underline; }

  /* ---------- Metrics ---------- */
  .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 26px; }
  .stat-tile { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px 18px; }
  .stat-tile .value { font-size: 28px; font-weight: 700; }
  .stat-tile .label { font-size: 12.5px; color: var(--text-secondary); margin-top: 2px; }
  .chart-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 18px 20px; margin-bottom: 18px; }
  .chart-card h3 { font-size: 13.5px; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.02em; font-weight: 700; margin-bottom: 14px; }
  .bar-row { display: grid; grid-template-columns: 150px 1fr 42px; align-items: center; gap: 10px; margin-bottom: 9px; }
  .bar-row .bar-label { font-size: 13px; color: var(--text-primary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar-track { background: var(--gridline); border-radius: 4px; height: 16px; position: relative; }
  .bar-fill { height: 16px; border-radius: 4px; min-width: 4px; }
  .bar-row .bar-value { font-size: 12.5px; color: var(--text-secondary); text-align: right; font-variant-numeric: tabular-nums; }

  .toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: var(--text-primary); color: var(--page);
    padding: 10px 18px; border-radius: 9px; font-size: 13px; z-index: 100;
  }
</style>
</head>
<body>

  <!-- ============ LOGIN ============ -->
  <div id="login-view">
    <form class="login-card" id="login-form">
      <div class="logo-dot">M</div>
      <h1>Panel de administración</h1>
      <p class="sub">MEDi — gestión de profesionales y métricas</p>
      <div class="field">
        <label for="login-password">Contraseña</label>
        <input type="password" id="login-password" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn block" id="login-btn">Ingresar</button>
      <p class="error-msg" id="login-error"></p>
    </form>
  </div>

  <!-- ============ APP ============ -->
  <div id="app-view" hidden>
    <header class="topbar">
      <div class="brand"><span class="dot">M</span> MEDi — Administración</div>
      <button class="logout-link" id="logout-btn">Cerrar sesión</button>
    </header>
    <nav class="tabs">
      <button class="tab-btn active" data-view="profesionales">Profesionales</button>
      <button class="tab-btn" data-view="metricas">Métricas</button>
    </nav>
    <main>
      <section id="view-profesionales">
        <div class="toolbar">
          <div class="search-input"><input type="text" id="buscar-input" placeholder="Buscar por nombre o especialidad…"></div>
          <button class="btn" id="nuevo-profesional-btn">+ Nuevo profesional</button>
        </div>
        <div id="profesionales-list"><p class="muted-text">Cargando…</p></div>
      </section>

      <section id="view-metricas" hidden>
        <div class="stat-grid" id="stat-grid"></div>
        <div class="chart-card">
          <h3>Búsquedas por especialidad</h3>
          <div id="chart-busquedas"></div>
        </div>
        <div class="chart-card">
          <h3>Contactos por profesional</h3>
          <div id="chart-contactos"></div>
        </div>
      </section>
    </main>
  </div>

  <!-- ============ MODAL: alta / edición de profesional ============ -->
  <div class="modal-backdrop" id="modal-backdrop" hidden>
    <div class="modal-card">
      <h2 id="modal-title">Nuevo profesional</h2>
      <form id="profesional-form">
        <div class="grid-2">
          <div class="field"><label>Nombre *</label><input type="text" id="f-nombre" required></div>
          <div class="field"><label>Apellido *</label><input type="text" id="f-apellido" required></div>
          <div class="field"><label>Email</label><input type="email" id="f-email" placeholder="opcional"></div>
          <div class="field"><label>Matrícula</label><input type="text" id="f-matricula"></div>
          <div class="field"><label>Teléfono</label><input type="tel" id="f-telefono"></div>
          <div class="field"><label>WhatsApp</label><input type="tel" id="f-whatsapp" placeholder="cód. país + número"></div>
        </div>
        <div class="field"><label>Bio / descripción breve</label><textarea id="f-bio"></textarea></div>

        <div class="toggle-row">
          <input type="checkbox" id="f-atiende-domicilio">
          <label for="f-atiende-domicilio">Atiende a domicilio</label>
        </div>
        <div class="toggle-row" id="row-activo" hidden>
          <input type="checkbox" id="f-activo" checked>
          <label for="f-activo">Activo (visible en la búsqueda pública)</label>
        </div>

        <p class="section-title">Especialidades</p>
        <div class="especialidades-box" id="especialidades-box"></div>

        <p class="section-title" id="consultorios-title">Consultorio</p>
        <div id="consultorios-container"></div>
        <button type="button" class="btn secondary small" id="agregar-consultorio-btn" hidden>+ Agregar otro consultorio</button>

        <div class="error-msg" id="form-error"></div>
        <div class="modal-actions">
          <button type="button" class="btn secondary" id="cancelar-btn">Cancelar</button>
          <button type="submit" class="btn" id="guardar-btn">Guardar</button>
        </div>
      </form>
    </div>
  </div>

  <div class="toast" id="toast" hidden></div>

<script>
(function () {
  'use strict';

  var API_BASE = 'https://medi-backend-production-ab1c.up.railway.app';
  var DIAS = ['Domingo', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'];

  var state = {
    token: null,
    especialidades: [],       // catálogo [{id, nombre}]
    profesionales: [],        // último listado cargado
    editando: null,           // id del profesional en edición, o null si es alta
    consultorios: []          // consultorios en el formulario actual (con horarios locales)
  };

  // ---------- helpers ----------
  function $(sel) { return document.querySelector(sel); }
  function $all(sel) { return Array.prototype.slice.call(document.querySelectorAll(sel)); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  }); }
  function showToast(msg) {
    var t = $('#toast');
    t.textContent = msg;
    t.hidden = false;
    clearTimeout(showToast._tm);
    showToast._tm = setTimeout(function () { t.hidden = true; }, 3200);
  }

  function api(path, opts) {
    opts = opts || {};
    var headers = Object.assign({}, opts.headers || {});
    if (opts.body) headers['Content-Type'] = 'application/json';
    if (state.token) headers['Authorization'] = 'Bearer ' + state.token;
    return fetch(API_BASE + path, {
      method: opts.method || 'GET',
      headers: headers,
      body: opts.body ? JSON.stringify(opts.body) : undefined
    }).then(function (res) {
      if (res.status === 401 || res.status === 403) {
        cerrarSesion('Tu sesión venció. Ingresá de nuevo.');
        throw new Error('No autorizado');
      }
      return res.json().then(function (data) {
        if (!res.ok) throw new Error(data.error || 'Error de red');
        return data;
      });
    });
  }

  // ---------- login ----------
  $('#login-form').addEventListener('submit', function (e) {
    e.preventDefault();
    var pass = $('#login-password').value;
    var btn = $('#login-btn');
    var err = $('#login-error');
    err.textContent = '';
    btn.disabled = true;
    btn.textContent = 'Ingresando…';
    fetch(API_BASE + '/admin/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: pass })
    }).then(function (res) { return res.json().then(function (d) { return { ok: res.ok, d: d }; }); })
      .then(function (r) {
        if (!r.ok) throw new Error(r.d.error || 'No se pudo iniciar sesión');
        state.token = r.d.token;
        iniciarApp();
      })
      .catch(function (e) { err.textContent = e.message; })
      .finally(function () { btn.disabled = false; btn.textContent = 'Ingresar'; });
  });

  function cerrarSesion(mensaje) {
    state.token = null;
    $('#app-view').hidden = true;
    $('#login-view').hidden = false;
    $('#login-password').value = '';
    $('#login-error').textContent = mensaje || '';
  }
  $('#logout-btn').addEventListener('click', function () { cerrarSesion(''); });

  function iniciarApp() {
    $('#login-view').hidden = true;
    $('#app-view').hidden = false;
    api('/especialidades').then(function (data) {
      state.especialidades = data;
      cargarProfesionales();
    });
  }

  // ---------- tabs ----------
  $all('.tab-btn').forEach(function (btn) {
    btn.addEventListener('click', function () {
      $all('.tab-btn').forEach(function (b) { b.classList.remove('active'); });
      btn.classList.add('active');
      var view = btn.getAttribute('data-view');
      $('#view-profesionales').hidden = view !== 'profesionales';
      $('#view-metricas').hidden = view !== 'metricas';
      if (view === 'metricas') cargarMetricas();
    });
  });

  // ---------- listado de profesionales ----------
  function cargarProfesionales() {
    $('#profesionales-list').innerHTML = '<p class="muted-text">Cargando…</p>';
    api('/admin/profesionales').then(function (data) {
      state.profesionales = data;
      renderProfesionales();
    }).catch(function (e) { $('#profesionales-list').innerHTML = '<p class="error-msg">' + esc(e.message) + '</p>'; });
  }

  function renderProfesionales() {
    var filtro = ($('#buscar-input').value || '').trim().toLowerCase();
    var lista = state.profesionales.filter(function (p) {
      if (!filtro) return true;
      var nombreCompleto = (p.nombre + ' ' + p.apellido).toLowerCase();
      var especialidadesTexto = (p.especialidades || []).map(function (e) { return e.nombre.toLowerCase(); }).join(' ');
      return nombreCompleto.indexOf(filtro) !== -1 || especialidadesTexto.indexOf(filtro) !== -1;
    });
    var cont = $('#profesionales-list');
    if (lista.length === 0) {
      cont.innerHTML = '<div class="empty-state">No hay profesionales que coincidan con la búsqueda.</div>';
      return;
    }
    var html = '<table class="list"><thead><tr>' +
      '<th>Nombre</th><th>Especialidades</th><th>Contacto</th><th>Consultorios</th><th>Estado</th><th></th>' +
      '</tr></thead><tbody>';
    lista.forEach(function (p) {
      var especialidadesHtml = (p.especialidades || []).map(function (e) {
        return '<span class="chip especialidad">' + esc(e.nombre) + '</span>';
      }).join('') || '<span class="muted-text">—</span>';
      var contacto = [p.whatsapp, p.telefono].filter(Boolean).join(' · ') || '<span class="muted-text">—</span>';
      var estadoHtml = '';
      if (p.atiende_domicilio) estadoHtml += '<span class="chip domicilio">🏠 A domicilio</span>';
      if (!p.activo) estadoHtml += '<span class="chip inactivo">Inactivo</span>';
      if (!estadoHtml) estadoHtml = '<span class="muted-text">—</span>';
      html += '<tr>' +
        '<td><strong>' + esc(p.nombre) + ' ' + esc(p.apellido) + '</strong>' + (p.matricula ? '<div class="muted-text">Mat. ' + esc(p.matricula) + '</div>' : '') + '</td>' +
        '<td>' + especialidadesHtml + '</td>' +
        '<td>' + contacto + '</td>' +
        '<td>' + (p.cantidad_consultorios || 0) + '</td>' +
        '<td>' + estadoHtml + '</td>' +
        '<td><button class="btn secondary small" data-editar="' + p.id + '">Editar</button></td>' +
        '</tr>';
    });
    html += '</tbody></table>';
    cont.innerHTML = html;
    $all('[data-editar]').forEach(function (btn) {
      btn.addEventListener('click', function () { abrirEdicion(btn.getAttribute('data-editar')); });
    });
  }
  $('#buscar-input').addEventListener('input', renderProfesionales);

  // ---------- modal: alta / edición ----------
  function renderEspecialidadesBox(seleccionadas) {
    seleccionadas = seleccionadas || [];
    var box = $('#especialidades-box');
    box.innerHTML = state.especialidades.map(function (e) {
      var checked = seleccionadas.indexOf(e.id) !== -1 ? 'checked' : '';
      return '<div class="check-row"><input type="checkbox" value="' + e.id + '" id="esp-' + e.id + '" ' + checked + '>' +
        '<label for="esp-' + e.id + '">' + esc(e.nombre) + '</label></div>';
    }).join('');
  }

  function consultorioTemplate(c, idx) {
    c = c || {};
    var horarios = c.horarios || [];
    var horariosHtml = horarios.map(function (h, hi) {
      return '<div class="horario-row" data-horario-idx="' + hi + '">' +
        '<span>' + DIAS[h.dia_semana] + '</span><span>' + h.hora_inicio.slice(0,5) + '–' + h.hora_fin.slice(0,5) + '</span>' +
        '<button type="button" class="btn secondary small" data-borrar-horario="' + idx + ':' + hi + '">Quitar</button></div>';
    }).join('');
    return '<div class="card-block" data-consultorio-idx="' + idx + '">' +
      '<div class="card-block-head"><strong>Consultorio</strong>' +
      (idx > 0 || c.esExistente ? '<button type="button" class="btn secondary small" data-borrar-consultorio="' + idx + '">Eliminar consultorio</button>' : '') +
      '</div>' +
      '<div class="grid-2">' +
      '<div class="field"><label>Nombre</label><input type="text" data-c-field="nombre" data-c-idx="' + idx + '" value="' + esc(c.nombre || '') + '"></div>' +
      '<div class="field"><label>Teléfono del consultorio</label><input type="tel" data-c-field="telefono" data-c-idx="' + idx + '" value="' + esc(c.telefono || '') + '"></div>' +
      '<div class="field"><label>Dirección</label><input type="text" data-c-field="direccion" data-c-idx="' + idx + '" value="' + esc(c.direccion || '') + '"></div>' +
      '<div class="field"><label>Ciudad</label><input type="text" data-c-field="ciudad" data-c-idx="' + idx + '" value="' + esc(c.ciudad || '') + '"></div>' +
      '<div class="field"><label>Provincia</label><input type="text" data-c-field="provincia" data-c-idx="' + idx + '" value="' + esc(c.provincia || '') + '"></div>' +
      '<div class="field"></div>' +
      '<div class="field"><label>Latitud</label><input type="number" step="any" data-c-field="lat" data-c-idx="' + idx + '" value="' + (c.lat != null ? c.lat : '') + '"></div>' +
      '<div class="field"><label>Longitud</label><input type="number" step="any" data-c-field="lng" data-c-idx="' + idx + '" value="' + (c.lng != null ? c.lng : '') + '"></div>' +
      '</div>' +
      '<a class="maps-link" href="#" data-abrir-maps="' + idx + '">Buscar dirección en Google Maps →</a>' +
      (c.id ? '<div style="margin-top:8px"><button type="button" class="btn secondary small" data-guardar-consultorio="' + idx + '">Guardar cambios del consultorio</button></div>' : '') +
      '<p class="section-title" style="margin-top:16px">Horarios de atención</p>' +
      '<div data-horarios-list="' + idx + '">' + horariosHtml + '</div>' +
      '<div class="horario-row">' +
      '<select data-h-dia="' + idx + '">' + DIAS.map(function (d, i) { return '<option value="' + i + '">' + d + '</option>'; }).join('') + '</select>' +
      '<input type="time" data-h-inicio="' + idx + '" value="09:00">' +
      '<input type="time" data-h-fin="' + idx + '" value="13:00">' +
      '<button type="button" class="btn secondary small" data-agregar-horario="' + idx + '">+ Agregar</button>' +
      '</div>' +
      '</div>';
  }

  function renderConsultorios() {
    $('#consultorios-container').innerHTML = state.consultorios.map(consultorioTemplate).join('');
    $('#consultorios-title').textContent = state.consultorios.length > 1 ? 'Consultorios' : 'Consultorio';
    bindConsultorioEvents();
  }

  function bindConsultorioEvents() {
    $all('[data-c-field]').forEach(function (input) {
      input.addEventListener('input', function () {
        var idx = Number(input.getAttribute('data-c-idx'));
        var field = input.getAttribute('data-c-field');
        var val = input.value;
        state.consultorios[idx][field] = (field === 'lat' || field === 'lng') ? (val === '' ? null : Number(val)) : val;
      });
    });
    $all('[data-abrir-maps]').forEach(function (a) {
      a.addEventListener('click', function (e) {
        e.preventDefault();
        var idx = Number(a.getAttribute('data-abrir-maps'));
        var c = state.consultorios[idx];
        var q = [c.direccion, c.ciudad, c.provincia].filter(Boolean).join(', ');
        window.open('https://www.google.com/maps/search/' + encodeURIComponent(q || 'Argentina'), '_blank', 'noopener');
      });
    });
    $all('[data-agregar-horario]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var idx = Number(btn.getAttribute('data-agregar-horario'));
        var dia = Number($('[data-h-dia="' + idx + '"]').value);
        var inicio = $('[data-h-inicio="' + idx + '"]').value;
        var fin = $('[data-h-fin="' + idx + '"]').value;
        if (!inicio || !fin) return;
        var c = state.consultorios[idx];
        c.horarios = c.horarios || [];
        var nuevoHorario = { dia_semana: dia, hora_inicio: inicio + ':00', hora_fin: fin + ':00' };
        if (c.id) {
          // consultorio ya existe en el backend: guardamos el horario al toque
          api('/admin/horarios', { method: 'POST', body: Object.assign({ consultorio_id: c.id }, nuevoHorario) })
            .then(function (h) { c.horarios.push(h); renderConsultorios(); showToast('Horario agregado'); })
            .catch(function (e) { showToast(e.message); });
        } else {
          c.horarios.push(nuevoHorario);
          renderConsultorios();
        }
      });
    });
    $all('[data-borrar-horario]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var parts = btn.getAttribute('data-borrar-horario').split(':');
        var idx = Number(parts[0]), hi = Number(parts[1]);
        var c = state.consultorios[idx];
        var horario = c.horarios[hi];
        if (horario.id) {
          api('/admin/horarios/' + horario.id, { method: 'DELETE' })
            .then(function () { c.horarios.splice(hi, 1); renderConsultorios(); showToast('Horario eliminado'); })
            .catch(function (e) { showToast(e.message); });
        } else {
          c.horarios.splice(hi, 1);
          renderConsultorios();
        }
      });
    });
    $all('[data-guardar-consultorio]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var idx = Number(btn.getAttribute('data-guardar-consultorio'));
        var c = state.consultorios[idx];
        api('/admin/consultorios/' + c.id, {
          method: 'PUT',
          body: { nombre: c.nombre, direccion: c.direccion, ciudad: c.ciudad, provincia: c.provincia, lat: c.lat, lng: c.lng, telefono: c.telefono }
        }).then(function () { showToast('Consultorio actualizado'); }).catch(function (e) { showToast(e.message); });
      });
    });
    $all('[data-borrar-consultorio]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var idx = Number(btn.getAttribute('data-borrar-consultorio'));
        var c = state.consultorios[idx];
        var quitar = function () { state.consultorios.splice(idx, 1); renderConsultorios(); };
        if (c.id) {
          if (!window.confirm('¿Eliminar este consultorio y sus horarios?')) return;
          api('/admin/consultorios/' + c.id, { method: 'DELETE' }).then(function () { quitar(); showToast('Consultorio eliminado'); }).catch(function (e) { showToast(e.message); });
        } else {
          quitar();
        }
      });
    });
  }

  $('#agregar-consultorio-btn').addEventListener('click', function () {
    state.consultorios.push({ horarios: [] });
    renderConsultorios();
  });

  function abrirModal(modoEdicion) {
    $('#modal-title').textContent = modoEdicion ? 'Editar profesional' : 'Nuevo profesional';
    $('#row-activo').hidden = !modoEdicion;
    $('#agregar-consultorio-btn').hidden = !modoEdicion;
    $('#form-error').textContent = '';
    $('#modal-backdrop').hidden = false;
  }
  function cerrarModal() {
    $('#modal-backdrop').hidden = true;
    state.editando = null;
    state.consultorios = [];
  }
  $('#cancelar-btn').addEventListener('click', cerrarModal);

  $('#nuevo-profesional-btn').addEventListener('click', function () {
    state.editando = null;
    state.consultorios = [{ horarios: [] }];
    $('#profesional-form').reset();
    $('#f-atiende-domicilio').checked = false;
    renderEspecialidadesBox([]);
    renderConsultorios();
    abrirModal(false);
  });

  function abrirEdicion(id) {
    api('/admin/profesionales/' + id).then(function (p) {
      state.editando = p.id;
      $('#f-nombre').value = p.nombre || '';
      $('#f-apellido').value = p.apellido || '';
      $('#f-email').value = p.email && p.email.indexOf('@medi.local') === -1 ? p.email : '';
      $('#f-matricula').value = p.matricula || '';
      $('#f-telefono').value = p.telefono || '';
      $('#f-whatsapp').value = p.whatsapp || '';
      $('#f-bio').value = p.bio || '';
      $('#f-atiende-domicilio').checked = !!p.atiende_domicilio;
      $('#f-activo').checked = p.activo !== false;
      renderEspecialidadesBox((p.especialidades || []).map(function (e) { return e.id; }));
      state.consultorios = (p.consultorios || []).map(function (c) { return Object.assign({ esExistente: true }, c); });
      if (state.consultorios.length === 0) state.consultorios = [{ horarios: [] }];
      renderConsultorios();
      abrirModal(true);
    }).catch(function (e) { showToast(e.message); });
  }

  $('#profesional-form').addEventListener('submit', function (e) {
    e.preventDefault();
    var especialidadIds = $all('#especialidades-box input:checked').map(function (i) { return Number(i.value); });
    var btn = $('#guardar-btn');
    var err = $('#form-error');
    err.textContent = '';
    btn.disabled = true;
    btn.textContent = 'Guardando…';

    if (state.editando) {
      var datosBasicos = {
        nombre: $('#f-nombre').value.trim(),
        apellido: $('#f-apellido').value.trim(),
        telefono: $('#f-telefono').value.trim() || null,
        whatsapp: $('#f-whatsapp').value.trim() || null,
        matricula: $('#f-matricula').value.trim() || null,
        bio: $('#f-bio').value.trim() || null,
        atiende_domicilio: $('#f-atiende-domicilio').checked,
        activo: $('#f-activo').checked
      };
      Promise.all([
        api('/admin/profesionales/' + state.editando, { method: 'PUT', body: datosBasicos }),
        api('/admin/profesionales/' + state.editando + '/especialidades', { method: 'PUT', body: { especialidad_ids: especialidadIds } })
      ]).then(function () {
        // Consultorios nuevos (sin id todavía) se crean recién ahora
        var nuevos = state.consultorios.filter(function (c) { return !c.id && (c.direccion || (c.lat != null && c.lng != null)); });
        return Promise.all(nuevos.map(function (c) {
          return api('/admin/profesionales/' + state.editando + '/consultorios', { method: 'POST', body: c })
            .then(function (creado) {
              return Promise.all((c.horarios || []).map(function (h) {
                return api('/admin/horarios', { method: 'POST', body: Object.assign({ consultorio_id: creado.id }, h) });
              }));
            });
        }));
      }).then(function () {
        showToast('Profesional actualizado');
        cerrarModal();
        cargarProfesionales();
      }).catch(function (e) { err.textContent = e.message; })
        .finally(function () { btn.disabled = false; btn.textContent = 'Guardar'; });
    } else {
      var primerConsultorio = state.consultorios[0] || {};
      var tieneConsultorio = primerConsultorio.lat != null && primerConsultorio.lng != null;
      var body = {
        nombre: $('#f-nombre').value.trim(),
        apellido: $('#f-apellido').value.trim(),
        email: $('#f-email').value.trim() || undefined,
        telefono: $('#f-telefono').value.trim() || null,
        whatsapp: $('#f-whatsapp').value.trim() || null,
        matricula: $('#f-matricula').value.trim() || null,
        bio: $('#f-bio').value.trim() || null,
        atiende_domicilio: $('#f-atiende-domicilio').checked,
        especialidad_ids: especialidadIds,
        consultorio: tieneConsultorio ? primerConsultorio : undefined,
        horarios: tieneConsultorio ? (primerConsultorio.horarios || []) : undefined
      };
      if (!tieneConsultorio && !body.atiende_domicilio) {
        err.textContent = 'Cargá la ubicación del consultorio (lat/lng) o marcá "Atiende a domicilio".';
        btn.disabled = false; btn.textContent = 'Guardar';
        return;
      }
      api('/admin/profesionales', { method: 'POST', body: body })
        .then(function () {
          showToast('Profesional creado');
          cerrarModal();
          cargarProfesionales();
        }).catch(function (e) { err.textContent = e.message; })
        .finally(function () { btn.disabled = false; btn.textContent = 'Guardar'; });
    }
  });

  // ---------- métricas ----------
  function statTile(valor, etiqueta) {
    return '<div class="stat-tile"><div class="value">' + valor + '</div><div class="label">' + etiqueta + '</div></div>';
  }
  function barChart(filas, campoLabel, color) {
    if (!filas || filas.length === 0) return '<p class="muted-text">Todavía no hay datos.</p>';
    var max = Math.max.apply(null, filas.map(function (f) { return f.total; }));
    return filas.map(function (f) {
      var pct = max > 0 ? Math.max((f.total / max) * 100, 3) : 0;
      return '<div class="bar-row">' +
        '<div class="bar-label" title="' + esc(f[campoLabel]) + '">' + esc(f[campoLabel]) + '</div>' +
        '<div class="bar-track"><div class="bar-fill" style="width:' + pct + '%;background:' + color + '"></div></div>' +
        '<div class="bar-value">' + f.total + '</div>' +
        '</div>';
    }).join('');
  }
  function cargarMetricas() {
    $('#stat-grid').innerHTML = '<p class="muted-text">Cargando…</p>';
    api('/admin/metricas').then(function (m) {
      $('#stat-grid').innerHTML =
        statTile(m.totales.busquedas, 'Búsquedas totales') +
        statTile(m.totales.contactos, 'Contactos totales') +
        statTile(m.totales.profesionales_activos, 'Profesionales activos');
      $('#chart-busquedas').innerHTML = barChart(m.busquedasPorEspecialidad, 'especialidad', 'var(--chart-blue)');
      $('#chart-contactos').innerHTML = barChart(m.contactosPorProfesional, 'profesional', 'var(--chart-orange)');
    }).catch(function (e) { $('#stat-grid').innerHTML = '<p class="error-msg">' + esc(e.message) + '</p>'; });
  }

})();
</script>
</body>
</html>
